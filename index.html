
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Profile | VBIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222;
    }

    /* VBIT logo at the top */
    .college-logo {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0 auto 15px;
    }

    /* Student application form */
    .profile-container {
      max-width: 750px;
      margin: 0 auto;
      padding: 30px;
      background-color: white;
      border: 1px solid #ccc;
    }

    h1 {
      text-align: center;
      color: #174d36;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-bottom: 25px;
    }

    h2 {
      color: #174d36;
      font-size: 18px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
      margin-top: 25px;
    }

    .field {
      margin: 18px 0;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .field p {
      margin: 0;
      padding: 11px;
      background-color: #fafafa;
      border: 1px solid #ddd;
      min-height: 40px;
      overflow-wrap: anywhere;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skills span {
      padding: 8px 14px;
      background-color: #e7f3ec;
      color: #176b45;
      border: 1px solid #c8dfd0;
      border-radius: 4px;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .profile-container {
        padding: 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- College logo: automatically visible at the top -->
  <img
    src="vbit.jpg"
    alt="Vignana Bharathi Institute of Technology Logo"
    class="college-logo"
  >

  <main class="profile-container">

    <h1>STUDENT PROFILE</h1>

    <p class="subtitle">
      Vignana Bharathi Institute of Technology
    </p>

    <h2>Student Details</h2>

    <div class="field">
      <label>Student Name</label>
      <p>Pagidoju.Bhargavi</p>
    </div>

    <div class="field">
      <label>Student ID</label>
      <p>25P61A05P9</p>
    </div>

    <div class="field">
      <label>Course</label>
      <p>B.Tech - CSE</p>
    </div>

    <div class="field">
      <label>Year of Study</label>
      <p>2nd Year</p>
    </div>

    <div class="field">
      <label>College</label>
      <p>Vignana Bharathi Institute of Technology (VBIT)</p>
    </div>

    <div class="field">
      <label>Department</label>
      <p>Computer Science &amp; Engineering</p>
    </div>

    <h2>Technical Skills</h2>

    <div class="field">
      <div class="skills">
        <span>C</span>
        <span>Java</span>
        <span>Python</span>
        <span>Node.js</span>
      </div>
    </div>

    <div class="footer">
      Student Profile | VBIT
    </div>

  </main>

</body>
</html>
