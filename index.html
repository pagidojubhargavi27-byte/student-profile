
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - VBIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f4f4f4;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Original VBIT logo at the top */
    .college-logo {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 16px;
    }

    /* Profile form */
    .profile-container {
      width: 100%;
      max-width: 750px;
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border: 1px solid #ccc;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #174d36;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    h2 {
      margin-top: 24px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ccc;
      color: #174d36;
      font-size: 18px;
    }

    .field {
      margin: 18px 0;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .field p {
      min-height: 40px;
      margin: 0;
      padding: 11px;
      background: #fafafa;
      border: 1px solid #ddd;
      overflow-wrap: anywhere;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skills span {
      padding: 8px 14px;
      background: #e7f3ec;
      color: #176b45;
      border: 1px solid #c8dfd0;
      border-radius: 4px;
    }

    .footer {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid #ddd;
      text-align: center;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .profile-container {
        padding: 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-container">

    <h1>STUDENT PROFILE</h1>
<img src="vbit.png" style="width: 100%; height: auto;">


    <h2>Student Details</h2>

    <div class="field">
      <label>Student Name</label>
      <p>Pagidoju.Bhargavi</p>
    </div>

    <div class="field">
      <label>Student ID</label>
      <p>25P61A05P9</p>
    </div>

    <div class="field">
      <label>Course</label>
      <p>B.Tech - CSE</p>
    </div>

    <div class="field">
      <label>Year of Study</label>
      <p>2nd Year</p>
    </div>

    <div class="field">
      <label>College</label>
      <p>VBIT</p>
    </div>

    <div class="field">
      <label>Department</label>
      <p>Computer Science &amp; Engineering</p>
    </div>

    <h2>Technical Skills</h2>

    <div class="field">
      <div class="skills">
        <span>C</span>
        <span>Java</span>
        <span>Python</span>
        <span>Node.js</span>
      </div>
    </div>

    <div class="footer">
      Student Profile | VBIT
    </div>

  </main>

</body>
</html>
